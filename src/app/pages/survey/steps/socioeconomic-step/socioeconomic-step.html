<div class="step-container">
  <form [formGroup]="form">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Ingreso mensual aproximado ($)</mat-label>
        <input matInput type="number" formControlName="ingreso_mensual" min="0" step="0.01">
        <mat-error>Ingrese un valor válido (mayor o igual a 0)</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fuentes de ingreso (describa)</mat-label>
        <textarea matInput rows="3" formControlName="fuentes_ingreso" placeholder="Ej: Agricultura, jornales, ganadería, remesas..."></textarea>
      </mat-form-field>
    </div>

    <div class="check-group">
      <h4>Acceso a servicios financieros y técnicos</h4>
      <mat-checkbox formControlName="acceso_credito">Acceso a crédito</mat-checkbox>
      <mat-checkbox formControlName="asistencia_tecnica">Recibe asistencia técnica</mat-checkbox>
    </div>
  </form>
</div>
